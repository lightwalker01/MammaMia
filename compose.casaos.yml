name: mammamia

services:
  mammamia:
    image: ghcr.io/lightwalker01/mammamia:latest
    platform: linux/amd64
    container_name: mammamia
    restart: unless-stopped
    init: true
    ports:
      - target: 8080
        published: "8080"
        protocol: tcp
    environment:
      TZ: Europe/Rome
      TMDB_KEY: "CHANGE_ME_TMDB_KEY"
    volumes:
      - type: bind
        source: /DATA/AppData/mammamia
        target: /app/data
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    x-casaos:
      envs:
        - container: TMDB_KEY
          description:
            en_us: TMDB API key (required). Replace CHANGE_ME_TMDB_KEY before installation.
            it_it: Chiave API TMDB obbligatoria. Sostituisci CHANGE_ME_TMDB_KEY prima di installare.
        - container: TZ
          description:
            en_us: Time zone used by the application.
            it_it: Fuso orario utilizzato dall'applicazione.
      ports:
        - container: "8080"
          description:
            en_us: MammaMia web interface and Stremio add-on API.
            it_it: Interfaccia web MammaMia e API dell'addon Stremio.
      volumes:
        - container: /app/data
          description:
            en_us: Persistent configuration directory. config.json is created automatically from the image on first start and retained on updates.
            it_it: Cartella di configurazione persistente. config.json viene creato automaticamente dall'immagine al primo avvio e conservato negli aggiornamenti.

x-casaos:
  main: mammamia
  architectures:
    - amd64
  developer: UrloMythus
  author: lightwalker01 (unofficial container packaging)
  category: Media
  icon: https://creazilla-store.fra1.digitaloceanspaces.com/emojis/49647/pizza-emoji-clipart-md.png
  thumbnail: https://creazilla-store.fra1.digitaloceanspaces.com/emojis/49647/pizza-emoji-clipart-md.png
  title:
    en_us: MammaMia
    it_it: MammaMia
  tagline:
    en_us: Self-hosted Italian Stremio add-on
    it_it: Addon Stremio italiano self-hosted
  description:
    en_us: >
      Unofficial AMD64 Docker package of UrloMythus/MammaMia.
      This fork only keeps upstream sources synchronized and publishes an updated image on GHCR.
    it_it: >
      Container Docker AMD64 non ufficiale di UrloMythus/MammaMia.
      Questo fork sincronizza esclusivamente i sorgenti originali e pubblica un'immagine aggiornata su GHCR.
  tips:
    before_install:
      en_us: >
        Replace CHANGE_ME_TMDB_KEY with your TMDB API key before installing.
        The configuration file will be initialized automatically in /DATA/AppData/mammamia/config.json
        at first startup, then preserved on subsequent updates. The GHCR package must be public
        (or Docker logged in) for the image to be pulled.
      it_it: >
        Prima di installare sostituisci CHANGE_ME_TMDB_KEY con la tua API key TMDB.
        Il file /DATA/AppData/mammamia/config.json verrà creato automaticamente al primo avvio
        e conservato negli aggiornamenti. Il pacchetto GHCR deve essere pubblico
        (oppure Docker deve essere autenticato).
  webui_port: 8080
  index: /configure
  port_map: "8080"
